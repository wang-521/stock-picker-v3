name: Build HTML Page
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install simple deps（这里不需要akshare）
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas lxml beautifulsoup4

      - name: Build html page
        run: python build_html.py

      - name: Commit html
        run: |
          git config --global user.name "wang-521"
          git config --global user.email "wang-521@users.noreply.github.com"
          git add *.html
          git commit -m "update html" || echo "No html changes"
          git push
