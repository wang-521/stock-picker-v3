name: 每日自动选股-V3大师版
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies in venv
        run: |
          python -m pip install --upgrade pip
          pip install --default-timeout=180 requests pandas numpy lxml beautifulsoup4 akshare -i https://pypi.tuna.tsinghua.edu.cn/simple
          python -c "import akshare; print('✅ akshare ok', akshare.__version__)"

      - name: Run stock screener
        run: python stock_screener.py

      - name: Build html page
        run: python build_html.py

      - name: Commit and push changes
        run: |
          git config --global user.name "wang-521"
          git config --global user.email "wang-521@users.noreply.github.com"
          git add .
          git commit -m "Auto update stock data" || echo "No changes to commit"
          git push
